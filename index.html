<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Environment Battle</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    html, body {
      width:100%; height:100%; overflow:hidden;
      background:#0d1a0d;
      font-family:'Arial Black','Impact',sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #game-container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; }
    canvas { display:block; max-width:100%; max-height:100%; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    // ============================================================
    //  ENVIRONMENT BATTLE v2
    //  - Glowing trash (red) and normal items (green)
    //  - Health system, weapons, multi-touch
    // ============================================================
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 720;

    // ---------- BOOT ----------
    class BootScene extends Phaser.Scene {
      constructor() { super('Boot'); }
      create() {
        try { this.createTextures(); } catch (e) { console.error(e); }
        this.scene.start('Menu');
      }
      createTextures() {
        const g = this.add.graphics(); g.setVisible(false);
        const tex = (key, w, h) => g.generateTexture(key, w, h);

        // ---- TRASH (will have red glow) ----
        g.clear(); g.fillStyle(0xbbbbbb); g.fillRect(4,8,20,28); g.fillStyle(0xcc3333); g.fillRect(4,8,20,8); g.fillStyle(0x888888); g.fillRect(6,14,16,4); tex('trashCan',28,40);
        g.clear(); g.fillStyle(0x44aa44); g.fillRect(8,6,12,30); g.fillStyle(0x66cc66); g.fillRect(6,2,16,8); tex('trashBottle',28,40);
        g.clear(); g.fillStyle(0x333333); g.fillCircle(14,20,12); g.fillStyle(0x555555); g.fillCircle(10,16,4); tex('trashBag',28,40);
        g.clear(); g.fillStyle(0xeeeeee); g.fillRect(2,10,24,20); g.fillStyle(0xcccccc); g.fillRect(4,14,20,4); tex('trashPaper',28,40);
        g.clear(); g.fillStyle(0xaa8866); g.fillRect(2,8,24,24); g.fillStyle(0x886644); g.fillRect(2,8,24,4); tex('trashBox',28,40);

        // ---- NORMAL ITEMS (will have green glow) ----
        g.clear(); g.fillStyle(0xee3333); g.fillCircle(14,20,12); g.fillStyle(0x44aa44); g.fillRect(12,6,4,8); tex('apple',28,40);
        g.clear(); g.fillStyle(0xff8800); g.fillCircle(14,20,12); g.fillStyle(0xcc6600); g.fillRect(12,6,4,8); tex('orange',28,40);
        g.clear(); g.fillStyle(0x4488ff); g.fillRect(6,10,16,22); g.fillStyle(0x2266cc); g.fillRect(4,8,20,6); tex('cup',28,40);

        // ---- ANVIL ----
        g.clear(); g.fillStyle(0x444444); g.fillRect(0,10,48,30); g.fillStyle(0x666666); g.fillRect(4,14,40,12); g.fillStyle(0x222222); g.fillRect(12,6,24,6); tex('anvil',48,40);

        // ---- SKINS ----
        g.clear(); g.fillStyle(0x44aa44); g.fillRect(8,10,20,24); g.fillStyle(0xffccaa); g.fillCircle(18,8,8); g.fillStyle(0x222222); g.fillRect(10,20,4,8); g.fillRect(22,20,4,8); tex('player1',36,44);
        g.clear(); g.fillStyle(0x222222); g.fillRect(8,10,20,24); g.fillStyle(0xffccaa); g.fillCircle(18,8,8); g.fillStyle(0x111111); g.fillRect(6,0,24,6); g.fillStyle(0x222222); g.fillRect(10,20,4,8); g.fillRect(22,20,4,8); tex('playerMJ',36,44);
        g.clear(); g.fillStyle(0x4488ff); g.fillRect(8,10,20,24); g.fillStyle(0xffddcc); g.fillCircle(18,8,8); g.fillStyle(0xffffff); g.fillRect(10,20,4,8); g.fillRect(22,20,4,8); tex('playerVerity',36,44);
        g.clear(); g.fillStyle(0xcc3333); g.fillRect(8,10,20,24); g.fillStyle(0xffccaa); g.fillCircle(18,8,8); g.fillStyle(0x222222); g.fillRect(10,20,4,8); g.fillRect(22,20,4,8); tex('playerFalsity',36,44);
        g.clear(); g.fillStyle(0x8B5A2B); g.fillRect(8,10,20,24); g.fillStyle(0xC68642); g.fillCircle(18,8,8); g.fillStyle(0x5C3317); g.fillRect(10,20,4,8); g.fillRect(22,20,4,8); tex('playerMonkey',36,44);

        // ---- BIN ----
        g.clear(); g.fillStyle(0x888888); g.fillRect(0,0,40,30); g.fillStyle(0xaaaaaa); g.fillRect(4,4,32,22); g.fillStyle(0x666666); g.fillRect(0,0,40,4); tex('bin',40,30);

        // ---- MAPS ----
        g.clear(); g.fillStyle(0x3a5f3a); g.fillRect(0,0,480,720); g.fillStyle(0x4a7a4a); for(let i=0;i<20;i++){ g.fillCircle(Phaser.Math.Between(0,480), Phaser.Math.Between(0,720), Phaser.Math.Between(10,30)); } tex('mapPark',480,720);
        g.clear(); g.fillStyle(0x2a2a3a); g.fillRect(0,0,480,720); g.fillStyle(0x4a4a6a); for(let i=0;i<15;i++){ g.fillRect(Phaser.Math.Between(0,480), Phaser.Math.Between(0,720), Phaser.Math.Between(20,50), Phaser.Math.Between(10,20)); } tex('mapCity',480,720);
        g.clear(); g.fillStyle(0xeedd99); g.fillRect(0,0,480,720); g.fillStyle(0x4488cc); for(let i=0;i<8;i++){ g.fillEllipse(Phaser.Math.Between(0,480), Phaser.Math.Between(0,720), Phaser.Math.Between(30,80), Phaser.Math.Between(10,30)); } tex('mapBeach',480,720);
        g.clear(); g.fillStyle(0xccddee); g.fillRect(0,0,480,720); g.fillStyle(0xffffff); for(let i=0;i<30;i++){ g.fillCircle(Phaser.Math.Between(0,480), Phaser.Math.Between(0,720), Phaser.Math.Between(4,12)); } tex('mapSnow',480,720);

        // ---- HUD ----
        g.clear(); g.fillStyle(0x000000, 0.7); g.fillRect(0,0,480,100); tex('hudBg',480,100);

        // ---- HEALTH BAR ----
        g.clear(); g.fillStyle(0x44ff44); g.fillRect(0,0,200,16); g.generateTexture('healthFill',200,16);
        g.clear(); g.fillStyle(0x222222); g.fillRect(0,0,200,16); g.generateTexture('healthBg',200,16);
        g.clear(); g.fillStyle(0xffffff); g.fillRect(0,0,200,16); g.generateTexture('healthWhite',200,16);

        // ---- WEAPON ICONS ----
        g.clear(); g.fillStyle(0xaa6633); g.fillRect(4,0,6,20); g.fillStyle(0xcc8844); g.fillRect(0,18,14,6); tex('weaponStick',20,30);
        g.clear(); g.fillStyle(0x888888); g.fillRect(2,4,16,16); g.fillStyle(0xaaaaaa); g.fillRect(6,8,8,8); tex('weaponRock',20,30);
        g.clear(); g.fillStyle(0x44aaff); g.fillRect(6,2,8,24); g.fillStyle(0x66ccff); g.fillCircle(10,26,6); tex('weaponWater',20,30);

        g.destroy();
      }
    }

    // ---------- MENU ----------
    class MenuScene extends Phaser.Scene {
      constructor() { super('Menu'); }
      create() {
        this.add.text(GAME_WIDTH/2, 60, '🌍 ENVIRONMENT BATTLE', {
          fontFamily: 'Arial Black', fontSize: '42px', color: '#ffffff', stroke: '#2a6a2a', strokeThickness: 6
        }).setOrigin(0.5);
        this.add.text(GAME_WIDTH/2, 120, 'Catch trash, avoid hazards, battle!', {
          fontFamily: 'Arial', fontSize: '18px', color: '#cccccc'
        }).setOrigin(0.5);

        const btnStyle = { fontFamily: 'Arial Black', fontSize: '24px', color: '#fff', backgroundColor: '#2a6a2a', padding: { x: 20, y: 10 } };

        const twoP = this.add.text(GAME_WIDTH/2, 220, '👥 2 PLAYERS (local)', btnStyle).setOrigin(0.5).setInteractive({ useHandCursor: true });
        twoP.on('pointerdown', () => this.startGame('2p'));

        const vsAI = this.add.text(GAME_WIDTH/2, 300, '🤖 VS AI', btnStyle).setOrigin(0.5).setInteractive({ useHandCursor: true });
        vsAI.on('pointerdown', () => this.showAISelect());

        // Map select
        this.add.text(GAME_WIDTH/2, 420, 'SELECT MAP', { fontFamily: 'Arial Black', fontSize: '22px', color: '#fff' }).setOrigin(0.5);
        this.mapNames = ['🌳 Park', '🏙️ City', '🏖️ Beach', '❄️ Snow'];
        this.selectedMap = 0;
        this.mapButtons = [];
        for (let i = 0; i < 4; i++) {
          const btn = this.add.text(GAME_WIDTH/2 - 180 + i * 120, 480, this.mapNames[i], {
            fontFamily: 'Arial', fontSize: '16px', color: '#fff',
            backgroundColor: i === 0 ? '#4a8a4a' : '#2a4a2a', padding: { x: 10, y: 8 }
          }).setOrigin(0.5).setInteractive({ useHandCursor: true });
          btn.on('pointerdown', () => {
            this.selectedMap = i;
            this.mapButtons.forEach((b, j) => b.setStyle({ backgroundColor: j === i ? '#4a8a4a' : '#2a4a2a' }));
          });
          this.mapButtons.push(btn);
        }

        // Skin select
        this.add.text(GAME_WIDTH/2, 560, 'PLAYER 1 SKIN', { fontFamily: 'Arial Black', fontSize: '16px', color: '#fff' }).setOrigin(0.5);
        this.skinKeys = ['player1', 'playerMJ', 'playerVerity', 'playerFalsity', 'playerMonkey'];
        this.skinNames = ['Green', 'MJ', 'Verity', 'Falsity', 'Monkey'];
        this.p1Skin = 0;
        this.skinButtons = [];
        for (let i = 0; i < 5; i++) {
          const btn = this.add.text(GAME_WIDTH/2 - 200 + i * 100, 600, this.skinNames[i], {
            fontFamily: 'Arial', fontSize: '14px', color: '#fff',
            backgroundColor: i === 0 ? '#4a8a4a' : '#2a4a2a', padding: { x: 8, y: 6 }
          }).setOrigin(0.5).setInteractive({ useHandCursor: true });
          btn.on('pointerdown', () => {
            this.p1Skin = i;
            this.skinButtons.forEach((b, j) => b.setStyle({ backgroundColor: j === i ? '#4a8a4a' : '#2a4a2a' }));
          });
          this.skinButtons.push(btn);
        }

        // AI panel
        this.aiPanel = this.add.container(0, 0).setVisible(false).setDepth(100);
        const aiBg = this.add.rectangle(GAME_WIDTH/2, GAME_HEIGHT/2, 500, 400, 0x000000, 0.92).setStrokeStyle(2, 0x44aa44);
        const aiTitle = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 - 150, 'CHOOSE AI OPPONENT', { fontFamily: 'Arial Black', fontSize: '24px', color: '#fff' }).setOrigin(0.5);
        this.aiPanel.add([aiBg, aiTitle]);

        const aiOptions = ['Michael Jackson', 'Verity', 'Falsity', 'Monkey'];
        this.aiSkinKeys = ['playerMJ', 'playerVerity', 'playerFalsity', 'playerMonkey'];
        this.selectedAI = 0;
        this.aiButtons = [];
        for (let i = 0; i < 4; i++) {
          const btn = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 - 80 + i * 55, aiOptions[i], {
            fontFamily: 'Arial Black', fontSize: '20px', color: '#fff',
            backgroundColor: i === 0 ? '#4a8a4a' : '#2a4a2a', padding: { x: 20, y: 8 }
          }).setOrigin(0.5).setInteractive({ useHandCursor: true });
          btn.on('pointerdown', () => {
            this.selectedAI = i;
            this.aiButtons.forEach((b, j) => b.setStyle({ backgroundColor: j === i ? '#4a8a4a' : '#2a4a2a' }));
          });
          this.aiButtons.push(btn);
          this.aiPanel.add(btn);
        }

        const startAIBtn = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 + 145, 'START BATTLE', {
          fontFamily: 'Arial Black', fontSize: '22px', color: '#fff', backgroundColor: '#2a6a2a', padding: { x: 25, y: 10 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });
        startAIBtn.on('pointerdown', () => {
          this.aiPanel.setVisible(false);
          this.startGame('ai', this.selectedAI);
        });
        this.aiPanel.add(startAIBtn);

        const backBtn = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 + 205, 'CANCEL', {
          fontFamily: 'Arial Black', fontSize: '16px', color: '#fff', backgroundColor: '#aa3333', padding: { x: 15, y: 6 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });
        backBtn.on('pointerdown', () => this.aiPanel.setVisible(false));
        this.aiPanel.add(backBtn);
      }

      showAISelect() { this.aiPanel.setVisible(true); }

      startGame(mode, aiIndex = 0) {
        this.scene.start('Game', {
          mode,
          map: this.selectedMap,
          p1Skin: this.skinKeys[this.p1Skin],
          p2Skin: mode === '2p' ? this.skinKeys[this.p1Skin] : this.aiSkinKeys[aiIndex],
          aiIndex
        });
      }
    }

    // ---------- GAME ----------
    class GameScene extends Phaser.Scene {
      constructor() { super('Game'); }

      init(data) {
        this.mode = data.mode;
        this.mapIndex = data.map || 0;
        this.p1Skin = data.p1Skin || 'player1';
        this.p2Skin = data.p2Skin || 'playerVerity';
        this.aiIndex = data.aiIndex || 0;

        this.mapKeys = ['mapPark', 'mapCity', 'mapBeach', 'mapSnow'];

        // Item definitions
        this.trashItems = [
          { key: 'trashCan', points: 10, name: 'Can' },
          { key: 'trashBottle', points: 15, name: 'Bottle' },
          { key: 'trashBag', points: 20, name: 'Bag' },
          { key: 'trashPaper', points: 5, name: 'Paper' },
          { key: 'trashBox', points: 25, name: 'Box' }
        ];
        this.nonTrashItems = [
          { key: 'apple', points: -10, name: 'Apple' },
          { key: 'orange', points: -15, name: 'Orange' },
          { key: 'cup', points: -8, name: 'Cup' }
        ];
        this.anvilItem = { key: 'anvil', points: -30, name: 'Anvil' };

        // Player state
        this.p1 = {
          x: 200, y: 600, vx: 0, score: 0,
          health: 100, maxHealth: 100,
          stunned: false, stunTimer: 0,
          facing: 1, animTimer: 0,
          weaponLevel: 0, weaponName: 'None',
          scrap: 0, // currency from trash
          attackCooldown: 0
        };
        this.p2 = {
          x: 760, y: 600, vx: 0, score: 0,
          health: 100, maxHealth: 100,
          stunned: false, stunTimer: 0,
          facing: -1, animTimer: 0,
          weaponLevel: 0, weaponName: 'None',
          scrap: 0,
          attackCooldown: 0
        };

        this.fallingItems = [];
        this.gameOver = false;

        // Weapon shop data
        this.weaponShop = [
          { name: 'Stick', cost: 15, damage: 8, icon: 'weaponStick' },
          { name: 'Rock', cost: 30, damage: 15, icon: 'weaponRock' },
          { name: 'Water Gun', cost: 50, damage: 22, icon: 'weaponWater' }
        ];
      }

      create() {
        // Backgrounds
        this.add.image(240, 360, this.mapKeys[this.mapIndex]).setDisplaySize(480, 720);
        this.add.image(720, 360, this.mapKeys[this.mapIndex]).setDisplaySize(480, 720);
        this.add.rectangle(480, 360, 4, 720, 0xffffff, 0.8);

        // HUD backgrounds
        this.add.image(240, 50, 'hudBg').setDisplaySize(480, 100);
        this.add.image(720, 50, 'hudBg').setDisplaySize(480, 100);

        // Scores
        this.p1ScoreText = this.add.text(240, 15, 'P1: 0', { fontFamily: 'Arial Black', fontSize: '24px', color: '#fff' }).setOrigin(0.5);
        this.p2ScoreText = this.add.text(720, 15, 'P2: 0', { fontFamily: 'Arial Black', fontSize: '24px', color: '#fff' }).setOrigin(0.5);

        // Health bars
        this.p1HealthBg = this.add.image(240, 45, 'healthBg').setDisplaySize(220, 16);
        this.p1HealthFill = this.add.image(130, 45, 'healthWhite').setDisplaySize(220, 16).setOrigin(0, 0.5);
        this.p1HealthFill.setTint(0x44ff44);
        this.p1HealthText = this.add.text(240, 45, '100/100', { fontFamily: 'Arial', fontSize: '12px', color: '#fff' }).setOrigin(0.5);

        this.p2HealthBg = this.add.image(720, 45, 'healthBg').setDisplaySize(220, 16);
        this.p2HealthFill = this.add.image(610, 45, 'healthWhite').setDisplaySize(220, 16).setOrigin(0, 0.5);
        this.p2HealthFill.setTint(0x44ff44);
        this.p2HealthText = this.add.text(720, 45, '100/100', { fontFamily: 'Arial', fontSize: '12px', color: '#fff' }).setOrigin(0.5);

        // Scrap count
        this.p1ScrapText = this.add.text(240, 70, 'Scrap: 0', { fontFamily: 'Arial', fontSize: '14px', color: '#ffdd44' }).setOrigin(0.5);
        this.p2ScrapText = this.add.text(720, 70, 'Scrap: 0', { fontFamily: 'Arial', fontSize: '14px', color: '#ffdd44' }).setOrigin(0.5);

        // Weapon display
        this.p1WeaponText = this.add.text(240, 88, 'Weapon: None', { fontFamily: 'Arial', fontSize: '12px', color: '#aaa' }).setOrigin(0.5);
        this.p2WeaponText = this.add.text(720, 88, 'Weapon: None', { fontFamily: 'Arial', fontSize: '12px', color: '#aaa' }).setOrigin(0.5);

        // Player sprites
        this.p1Sprite = this.add.sprite(this.p1.x, this.p1.y, this.p1Skin).setDepth(10);
        this.p2Sprite = this.add.sprite(this.p2.x, this.p2.y, this.p2Skin).setDepth(10);
        this.p1Bin = this.add.sprite(this.p1.x, this.p1.y - 30, 'bin').setDepth(11);
        this.p2Bin = this.add.sprite(this.p2.x, this.p2.y - 30, 'bin').setDepth(11);

        // Stun text
        this.p1StunText = this.add.text(240, 160, 'STUNNED!', { fontFamily: 'Arial Black', fontSize: '28px', color: '#ff4444' }).setOrigin(0.5).setVisible(false).setDepth(20);
        this.p2StunText = this.add.text(720, 160, 'STUNNED!', { fontFamily: 'Arial Black', fontSize: '28px', color: '#ff4444' }).setOrigin(0.5).setVisible(false).setDepth(20);

        // Input — use multi-touch for simultaneous buttons
        this.input.addPointer(3);
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys({
          a: Phaser.Input.Keyboard.KeyCodes.A,
          d: Phaser.Input.Keyboard.KeyCodes.D,
          w: Phaser.Input.Keyboard.KeyCodes.W,
          s: Phaser.Input.Keyboard.KeyCodes.S,
          left: Phaser.Input.Keyboard.KeyCodes.LEFT,
          right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
          up: Phaser.Input.Keyboard.KeyCodes.UP,
          down: Phaser.Input.Keyboard.KeyCodes.DOWN
        });

        // Touch state
        this.touchState = { p1Left:false, p1Right:false, p1Attack:false, p2Left:false, p2Right:false, p2Attack:false };

        const btnSize = 66;
        const yPos = GAME_HEIGHT - 100;
        const btnAlpha = 0.35;

        // P1 buttons
        this.p1LeftBtn = this.add.rectangle(70, yPos, btnSize, btnSize, 0xffffff, btnAlpha).setInteractive().setDepth(30);
        this.p1RightBtn = this.add.rectangle(160, yPos, btnSize, btnSize, 0xffffff, btnAlpha).setInteractive().setDepth(30);
        this.p1AttackBtn = this.add.rectangle(115, yPos - 90, btnSize + 10, btnSize + 10, 0xff4444, 0.45).setInteractive().setDepth(30);
        this.add.text(70, yPos, '◀', { fontSize:'32px', color:'#fff' }).setOrigin(0.5).setDepth(31);
        this.add.text(160, yPos, '▶', { fontSize:'32px', color:'#fff' }).setOrigin(0.5).setDepth(31);
        this.add.text(115, yPos - 90, '⚔️', { fontSize:'28px', color:'#fff' }).setOrigin(0.5).setDepth(31);

        // P2 buttons
        this.p2LeftBtn = this.add.rectangle(800, yPos, btnSize, btnSize, 0xffffff, btnAlpha).setInteractive().setDepth(30);
        this.p2RightBtn = this.add.rectangle(890, yPos, btnSize, btnSize, 0xffffff, btnAlpha).setInteractive().setDepth(30);
        this.p2AttackBtn = this.add.rectangle(845, yPos - 90, btnSize + 10, btnSize + 10, 0xff4444, 0.45).setInteractive().setDepth(30);
        this.add.text(800, yPos, '◀', { fontSize:'32px', color:'#fff' }).setOrigin(0.5).setDepth(31);
        this.add.text(890, yPos, '▶', { fontSize:'32px', color:'#fff' }).setOrigin(0.5).setDepth(31);
        this.add.text(845, yPos - 90, '⚔️', { fontSize:'28px', color:'#fff' }).setOrigin(0.5).setDepth(31);

        // Multi-touch handlers for P1
        this.p1LeftBtn.on('pointerdown', () => this.touchState.p1Left = true);
        this.p1LeftBtn.on('pointerup', () => this.touchState.p1Left = false);
        this.p1LeftBtn.on('pointerout', () => this.touchState.p1Left = false);
        this.p1RightBtn.on('pointerdown', () => this.touchState.p1Right = true);
        this.p1RightBtn.on('pointerup', () => this.touchState.p1Right = false);
        this.p1RightBtn.on('pointerout', () => this.touchState.p1Right = false);
        this.p1AttackBtn.on('pointerdown', () => this.touchState.p1Attack = true);
        this.p1AttackBtn.on('pointerup', () => this.touchState.p1Attack = false);
        this.p1AttackBtn.on('pointerout', () => this.touchState.p1Attack = false);

        // Multi-touch handlers for P2
        this.p2LeftBtn.on('pointerdown', () => this.touchState.p2Left = true);
        this.p2LeftBtn.on('pointerup', () => this.touchState.p2Left = false);
        this.p2LeftBtn.on('pointerout', () => this.touchState.p2Left = false);
        this.p2RightBtn.on('pointerdown', () => this.touchState.p2Right = true);
        this.p2RightBtn.on('pointerup', () => this.touchState.p2Right = false);
        this.p2RightBtn.on('pointerout', () => this.touchState.p2Right = false);
        this.p2AttackBtn.on('pointerdown', () => this.touchState.p2Attack = true);
        this.p2AttackBtn.on('pointerup', () => this.touchState.p2Attack = false);
        this.p2AttackBtn.on('pointerout', () => this.touchState.p2Attack = false);

        // Spawn timer
        this.time.addEvent({ delay: 800, callback: this.spawnItem, callbackScope: this, loop: true });

        // Weapon shop timers (every 5 seconds, offer buy/upgrade)
        this.time.addEvent({ delay: 5000, callback: () => this.offerWeapon('p1'), callbackScope: this });
        if (this.mode === '2p') {
          this.time.addEvent({ delay: 5000, callback: () => this.offerWeapon('p2'), callbackScope: this });
        }
      }

      spawnItem() {
        if (this.gameOver) return;

        const roll = Phaser.Math.Between(1, 100);
        let isAnvil = false, isTrash = false, def;

        if (roll <= 10) {
          isAnvil = true;
          def = this.anvilItem;
        } else if (roll <= 65) {
          isTrash = true;
          def = Phaser.Utils.Array.GetRandom(this.trashItems);
        } else {
          def = Phaser.Utils.Array.GetRandom(this.nonTrashItems);
        }

        const x = Phaser.Math.Between(20, GAME_WIDTH - 20);
        const sprite = this.add.sprite(x, -40, def.key).setDepth(5);

        // ---- GLOW EFFECTS ----
        if (isTrash) {
          // Red glow for trash
          sprite.setTint(0xff8888);
          this.tweens.add({ targets: sprite, alpha: { from: 0.85, to: 1 }, duration: 400, yoyo: true, repeat: -1 });
        } else if (!isAnvil) {
          // Green glow for normal items
          sprite.setTint(0x88ff88);
          this.tweens.add({ targets: sprite, alpha: { from: 0.85, to: 1 }, duration: 400, yoyo: true, repeat: -1 });
        } else {
          // Anvil is plain
          sprite.setTint(0xaa4444);
        }

        this.fallingItems.push({
          sprite, def, isTrash, isAnvil,
          speed: isAnvil ? 180 : Phaser.Math.Between(120, 220),
          vx: isAnvil ? 0 : Phaser.Math.Between(-20, 20)
        });
      }

      offerWeapon(player) {
        if (this.gameOver) return;
        const p = player === 'p1' ? this.p1 : this.p2;
        if (p.weaponLevel >= this.weaponShop.length) return; // maxed

        const nextWeapon = this.weaponShop[p.weaponLevel];
        if (p.scrap < nextWeapon.cost) return;

        // Show purchase prompt as a floating text button near the player
        const x = player === 'p1' ? 240 : 720;
        const y = player === 'p1' ? 500 : 500;

        const bg = this.add.rectangle(x, y, 260, 60, 0x000000, 0.85).setStrokeStyle(2, 0xffdd44).setDepth(50);
        const label = this.add.text(x, y - 10, `Buy ${nextWeapon.name}? (${nextWeapon.cost} scrap)`, {
          fontFamily: 'Arial', fontSize: '13px', color: '#ffdd44'
        }).setOrigin(0.5).setDepth(51);
        const buyBtn = this.add.text(x - 50, y + 15, 'BUY', {
          fontFamily: 'Arial Black', fontSize: '16px', color: '#44ff44', backgroundColor: '#2a4a2a', padding: { x: 12, y: 4 }
        }).setOrigin(0.5).setInteractive().setDepth(51);
        const skipBtn = this.add.text(x + 50, y + 15, 'SKIP', {
          fontFamily: 'Arial Black', fontSize: '16px', color: '#ff8888', backgroundColor: '#4a2a2a', padding: { x: 12, y: 4 }
        }).setOrigin(0.5).setInteractive().setDepth(51);

        const cleanup = () => { bg.destroy(); label.destroy(); buyBtn.destroy(); skipBtn.destroy(); };
        buyBtn.on('pointerdown', () => {
          if (p.scrap >= nextWeapon.cost) {
            p.scrap -= nextWeapon.cost;
            p.weaponLevel++;
            p.weaponName = nextWeapon.name;
            this.updateHUD();
            this.showFloatingText(player === 'p1' ? this.p1.x : this.p2.x, 450, `Upgraded to ${nextWeapon.name}!`, '#ffdd44');
          }
          cleanup();
        });
        skipBtn.on('pointerdown', cleanup);

        // Auto-cleanup after 4 seconds
        this.time.delayedCall(4000, cleanup);
      }

      updateHUD() {
        this.p1ScoreText.setText('P1: ' + this.p1.score);
        this.p2ScoreText.setText('P2: ' + this.p2.score);
        this.p1HealthText.setText(Math.max(0, this.p1.health) + '/' + this.p1.maxHealth);
        this.p2HealthText.setText(Math.max(0, this.p2.health) + '/' + this.p2.maxHealth);
        this.p1ScrapText.setText('Scrap: ' + this.p1.scrap);
        this.p2ScrapText.setText('Scrap: ' + this.p2.scrap);
        this.p1WeaponText.setText('Weapon: ' + (this.p1.weaponName === 'None' ? 'None' : this.p1.weaponName + ' Lv' + this.p1.weaponLevel));
        this.p2WeaponText.setText('Weapon: ' + (this.p2.weaponName === 'None' ? 'None' : this.p2.weaponName + ' Lv' + this.p2.weaponLevel));

        // Health bar fill
        const p1Pct = Math.max(0, this.p1.health / this.p1.maxHealth);
        const p2Pct = Math.max(0, this.p2.health / this.p2.maxHealth);
        this.p1HealthFill.setDisplaySize(220 * p1Pct, 16);
        this.p2HealthFill.setDisplaySize(220 * p2Pct, 16);
        this.p1HealthFill.setTint(p1Pct > 0.5 ? 0x44ff44 : p1Pct > 0.25 ? 0xffaa44 : 0xff4444);
        this.p2HealthFill.setTint(p2Pct > 0.5 ? 0x44ff44 : p2Pct > 0.25 ? 0xffaa44 : 0xff4444);
      }

      showFloatingText(x, y, text, color) {
        const t = this.add.text(x, y, text, {
          fontFamily: 'Arial Black', fontSize: '20px', color: color,
          stroke: '#000', strokeThickness: 3
        }).setOrigin(0.5).setDepth(60);
        this.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 1000, onComplete: () => t.destroy() });
      }

      update(time, delta) {
        if (this.gameOver) return;
        const dt = delta / 1000;

        // ---- P1 movement ----
        if (!this.p1.stunned) {
          let mx = 0;
          if (this.keys.a.isDown || this.touchState.p1Left) mx -= 1;
          if (this.keys.d.isDown || this.touchState.p1Right) mx += 1;
          this.p1.vx = mx * 260;
          if (mx !== 0) this.p1.facing = mx;

          // Attack (P1: spacebar or touch button)
          this.p1.attackCooldown -= delta;
          if ((this.keys.w.isDown || this.touchState.p1Attack) && this.p1.attackCooldown <= 0 && this.p1.weaponLevel > 0) {
            this.performAttack('p1');
            this.p1.attackCooldown = 800;
          }
        } else {
          this.p1.vx = 0;
          this.p1.stunTimer -= delta;
          if (this.p1.stunTimer <= 0) {
            this.p1.stunned = false;
            this.p1StunText.setVisible(false);
            this.p1Sprite.clearTint();
          }
        }

        // ---- P2 movement ----
        if (this.mode === '2p') {
          if (!this.p2.stunned) {
            let mx = 0;
            if (this.keys.left.isDown || this.touchState.p2Left) mx -= 1;
            if (this.keys.right.isDown || this.touchState.p2Right) mx += 1;
            this.p2.vx = mx * 260;
            if (mx !== 0) this.p2.facing = mx;

            this.p2.attackCooldown -= delta;
            if ((this.keys.up.isDown || this.touchState.p2Attack) && this.p2.attackCooldown <= 0 && this.p2.weaponLevel > 0) {
              this.performAttack('p2');
              this.p2.attackCooldown = 800;
            }
          } else {
            this.p2.vx = 0;
            this.p2.stunTimer -= delta;
            if (this.p2.stunTimer <= 0) {
              this.p2.stunned = false;
              this.p2StunText.setVisible(false);
              this.p2Sprite.clearTint();
            }
          }
        } else {
          // AI
          if (!this.p2.stunned) {
            let targetX = 720;
            let bestDist = Infinity;
            for (const item of this.fallingItems) {
              if (item.isTrash && !item.isAnvil) {
                const d = Math.abs(item.sprite.x - this.p2.x) + Math.abs(item.sprite.y - this.p2.y) * 0.5;
                if (d < bestDist) { bestDist = d; targetX = item.sprite.x; }
              }
            }
            const dx = targetX - this.p2.x;
            if (Math.abs(dx) > 6) {
              this.p2.vx = Math.sign(dx) * 220;
              this.p2.facing = Math.sign(dx);
            } else {
              this.p2.vx = 0;
            }

            // AI attacks when close
            this.p2.attackCooldown -= delta;
            if (Math.abs(this.p2.x - this.p1.x) < 120 && this.p2.attackCooldown <= 0 && this.p2.weaponLevel > 0) {
              this.performAttack('p2');
              this.p2.attackCooldown = 1000;
            }
          } else {
            this.p2.vx = 0;
            this.p2.stunTimer -= delta;
            if (this.p2.stunTimer <= 0) {
              this.p2.stunned = false;
              this.p2StunText.setVisible(false);
              this.p2Sprite.clearTint();
            }
          }
        }

        // Apply movement
        this.p1.x = Phaser.Math.Clamp(this.p1.x + this.p1.vx * dt, 30, 450);
        this.p2.x = Phaser.Math.Clamp(this.p2.x + this.p2.vx * dt, 510, 930);

        // Bob animation
        this.p1.animTimer += delta;
        this.p2.animTimer += delta;
        const bob1 = Math.sin(this.p1.animTimer * 0.01) * 2;
        const bob2 = Math.sin(this.p2.animTimer * 0.01) * 2;

        this.p1Sprite.setPosition(this.p1.x, this.p1.y + bob1).setFlipX(this.p1.facing < 0);
        this.p1Bin.setPosition(this.p1.x, this.p1.y - 30 + bob1);
        this.p2Sprite.setPosition(this.p2.x, this.p2.y + bob2).setFlipX(this.p2.facing < 0);
        this.p2Bin.setPosition(this.p2.x, this.p2.y - 30 + bob2);

        // Falling items
        for (let i = this.fallingItems.length - 1; i >= 0; i--) {
          const item = this.fallingItems[i];
          item.sprite.y += item.speed * dt;
          item.sprite.x += item.vx * dt;
          item.sprite.rotation += 0.02;

          const d1 = Phaser.Math.Distance.Between(item.sprite.x, item.sprite.y, this.p1.x, this.p1.y - 20);
          const d2 = Phaser.Math.Distance.Between(item.sprite.x, item.sprite.y, this.p2.x, this.p2.y - 20);

          let caught = false;
          if (d1 < 40 && item.sprite.y < this.p1.y + 20 && item.sprite.y > this.p1.y - 60) {
            this.handleCatch(item, 'p1'); caught = true;
          } else if (d2 < 40 && item.sprite.y < this.p2.y + 20 && item.sprite.y > this.p2.y - 60) {
            this.handleCatch(item, 'p2'); caught = true;
          }

          if (caught || item.sprite.y > GAME_HEIGHT + 50) {
            item.sprite.destroy();
            this.fallingItems.splice(i, 1);
          }
        }

        this.updateHUD();
      }

      performAttack(player) {
        const attacker = player === 'p1' ? this.p1 : this.p2;
        const defender = player === 'p1' ? this.p2 : this.p1;
        const weapon = this.weaponShop[attacker.weaponLevel - 1];
        if (!weapon) return;

        // Check range
        if (Math.abs(attacker.x - defender.x) > 150) return;

        // Deal damage
        defender.health -= weapon.damage;
        defender.stunned = true;
        defender.stunTimer = 800;
        if (player === 'p1') {
          this.p2StunText.setVisible(true);
          this.p2Sprite.setTint(0xff4444);
        } else {
          this.p1StunText.setVisible(true);
          this.p1Sprite.setTint(0xff4444);
        }

        // Visual slash effect
        const slashX = player === 'p1' ? this.p1.x + 40 * this.p1.facing : this.p2.x + 40 * this.p2.facing;
        const slash = this.add.text(slashX, attacker.y - 20, '💥', { fontSize: '32px' }).setOrigin(0.5).setDepth(40);
        this.tweens.add({ targets: slash, scale: 2, alpha: 0, duration: 300, onComplete: () => slash.destroy() });

        this.showFloatingText(defender.x, defender.y - 60, `-${weapon.damage}`, '#ff4444');

        // Check death
        if (defender.health <= 0) {
          defender.health = 0;
          this.endGame(player);
        }
      }

      handleCatch(item, player) {
        const isP1 = player === 'p1';
        const p = isP1 ? this.p1 : this.p2;
        let points = item.def.points;

        if (item.isAnvil) {
          points = -Phaser.Math.Between(20, 50);
          p.health -= 15;
          p.stunned = true;
          p.stunTimer = 2000;
          if (isP1) {
            this.p1StunText.setVisible(true);
            this.p1Sprite.setTint(0xff4444);
          } else {
            this.p2StunText.setVisible(true);
            this.p2Sprite.setTint(0xff4444);
          }
          this.showFloatingText(isP1 ? this.p1.x : this.p2.x, (isP1 ? this.p1.y : this.p2.y) - 60, `ANVIL! -${Math.abs(points)}`, '#ff4444');
        } else if (item.isTrash) {
          // Trash gives points AND scrap
          p.score += points;
          p.scrap += Math.ceil(points / 5);
          this.showFloatingText(isP1 ? this.p1.x : this.p2.x, (isP1 ? this.p1.y : this.p2.y) - 60, `+${points}`, '#44ff44');
        } else {
          // Normal items deduct score AND health
          p.score += points;
          p.health += points; // points is negative
          this.showFloatingText(isP1 ? this.p1.x : this.p2.x, (isP1 ? this.p1.y : this.p2.y) - 60, `${points} HP`, '#ff8800');
        }

        // Clamp health
        p.health = Math.max(0, Math.min(p.maxHealth, p.health));

        // Check death
        if (p.health <= 0) {
          this.endGame(isP1 ? 'p2' : 'p1');
        }

        this.updateHUD();
      }

      endGame(winner) {
        this.gameOver = true;
        const winText = winner === 'p1' ? 'PLAYER 1 WINS!' : (this.mode === 'ai' ? 'AI WINS!' : 'PLAYER 2 WINS!');
        const color = winner === 'p1' ? '#44ff44' : '#ff4444';

        const overlay = this.add.rectangle(GAME_WIDTH/2, GAME_HEIGHT/2, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.75).setDepth(100);
        const title = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 - 60, winText, {
          fontFamily: 'Arial Black', fontSize: '48px', color: color, stroke: '#000', strokeThickness: 6
        }).setOrigin(0.5).setDepth(101);
        const scoreLine = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 + 20, `P1: ${this.p1.score}  |  P2: ${this.p2.score}`, {
          fontFamily: 'Arial', fontSize: '24px', color: '#fff'
        }).setOrigin(0.5).setDepth(101);

        const restartBtn = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 + 100, 'PLAY AGAIN', {
          fontFamily: 'Arial Black', fontSize: '24px', color: '#fff', backgroundColor: '#2a6a2a', padding: { x: 30, y: 12 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setDepth(101);
        restartBtn.on('pointerdown', () => this.scene.start('Menu'));
      }
    }

    // ---------- CONFIG ----------
    const config = {
      type: Phaser.AUTO,
      width: GAME_WIDTH,
      height: GAME_HEIGHT,
      parent: 'game-container',
      backgroundColor: '#0d1a0d',
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: GAME_WIDTH,
        height: GAME_HEIGHT
      },
      scene: [BootScene, MenuScene, GameScene],
      physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
      input: {
        activePointers: 4, // multi-touch support
        touch: { capture: true }
      }
    };

    new Phaser.Game(config);
  </script>
</body>
