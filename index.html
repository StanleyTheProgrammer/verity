<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Environment Battle</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    html, body {
      width:100%; height:100%; overflow:hidden;
      background:#0a0f0a;
      font-family: 'Trebuchet MS', 'Arial', sans-serif;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #game-container { width:100%; height:100%; display:flex; justify-content:center; align-items:center; }
    canvas { display:block; max-width:100%; max-height:100%; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>
    // ============================================================
    //  ENVIRONMENT BATTLE v3
    //  - 3 zones: P1 collect | BATTLEGROUND | P2 collect
    //  - Shop with weapons, health potions
    //  - Clean UI, glowing items, multi-touch
    // ============================================================
    const GAME_WIDTH = 1200;
    const GAME_HEIGHT = 720;

    // Zone boundaries
    const ZONE = {
      p1:   { x: 0,    w: 350, cx: 175 },
      mid:  { x: 350,  w: 500, cx: 600 },
      p2:   { x: 850,  w: 350, cx: 1025 }
    };
    const GROUND_Y = 600;

    // ---------- BOOT ----------
    class BootScene extends Phaser.Scene {
      constructor() { super('Boot'); }
      create() {
        try { this.createTextures(); } catch (e) { console.error(e); }
        this.scene.start('Menu');
      }
      createTextures() {
        const g = this.add.graphics(); g.setVisible(false);
        const tex = (k,w,h) => g.generateTexture(k,w,h);

        // ---- TRASH (red glow) ----
        g.clear(); g.fillStyle(0xdddddd); g.fillRoundedRect(4,8,20,28,4); g.fillStyle(0xcc3333); g.fillRoundedRect(4,8,20,8,4); g.fillStyle(0x999999); g.fillRect(6,16,16,3); tex('trashCan',28,40);
        g.clear(); g.fillStyle(0x44aa44); g.fillRoundedRect(8,6,12,30,4); g.fillStyle(0x66cc66); g.fillRect(6,2,16,8); tex('trashBottle',28,40);
        g.clear(); g.fillStyle(0x444444); g.fillCircle(14,22,12); g.fillStyle(0x666666); g.fillCircle(10,18,4); tex('trashBag',28,40);
        g.clear(); g.fillStyle(0xf0f0f0); g.fillRect(2,10,24,20); g.fillStyle(0xcccccc); g.fillRect(4,14,20,3); g.fillRect(4,20,20,3); tex('trashPaper',28,40);
        g.clear(); g.fillStyle(0xbb9977); g.fillRoundedRect(2,8,24,24,3); g.fillStyle(0x997755); g.fillRect(2,8,24,4); tex('trashBox',28,40);

        // ---- NORMAL (green glow) ----
        g.clear(); g.fillStyle(0xee3333); g.fillCircle(14,22,12); g.fillStyle(0x44aa44); g.fillRect(12,6,4,8); tex('apple',28,40);
        g.clear(); g.fillStyle(0xff9900); g.fillCircle(14,22,12); g.fillStyle(0xcc6600); g.fillRect(12,8,4,6); tex('orange',28,40);
        g.clear(); g.fillStyle(0x4488ff); g.fillRoundedRect(7,10,14,22,3); g.fillStyle(0x2266cc); g.fillRect(5,8,18,5); tex('cup',28,40);

        // ---- ANVIL ----
        g.clear(); g.fillStyle(0x555555); g.fillRect(2,10,44,28); g.fillStyle(0x777777); g.fillRect(6,14,36,10); g.fillStyle(0x333333); g.fillRect(12,6,24,6); tex('anvil',48,40);

        // ---- SKINS ----
        const drawBody = (bodyColor) => {
          g.clear();
          g.fillStyle(bodyColor); g.fillRoundedRect(8,12,20,26,4);
          g.fillStyle(0xffccaa); g.fillCircle(18,8,9);
          g.fillStyle(0x222222); g.fillRect(10,22,5,10); g.fillRect(21,22,5,10);
          g.fillStyle(0xffccaa); g.fillRect(4,16,5,12); g.fillRect(27,16,5,12);
        };
        drawBody(0x44aa44); tex('player1',36,46);
        drawBody(0x222222); g.fillStyle(0x111111); g.fillRect(6,0,24,6); tex('playerMJ',36,46);
        drawBody(0x4488ff); g.fillStyle(0xffffff); g.fillRect(12,2,12,4); tex('playerVerity',36,46);
        drawBody(0xcc3333); g.fillStyle(0x222222); g.fillRect(6,0,24,5); tex('playerFalsity',36,46);
        drawBody(0x8B5A2B); g.fillStyle(0xC68642); g.fillCircle(18,8,9); tex('playerMonkey',36,46);

        // ---- BIN ----
        g.clear(); g.fillStyle(0x777777); g.fillRoundedRect(0,4,40,28,6); g.fillStyle(0x999999); g.fillRoundedRect(4,8,32,20,4); g.fillStyle(0x555555); g.fillRect(0,4,40,5); tex('bin',40,34);

        // ---- MAPS ----
        g.clear(); g.fillStyle(0x3a5f3a); g.fillRect(0,0,1200,720); g.fillStyle(0x4a7a4a); for(let i=0;i<40;i++){ g.fillCircle(Phaser.Math.Between(0,1200), Phaser.Math.Between(0,720), Phaser.Math.Between(15,40)); } g.fillStyle(0x2a4a2a); g.fillRect(0,GROUND_Y,1200,120); tex('mapPark',1200,720);
        g.clear(); g.fillStyle(0x2a2a3a); g.fillRect(0,0,1200,720); g.fillStyle(0x3a3a5a); for(let i=0;i<25;i++){ g.fillRect(Phaser.Math.Between(0,1200), Phaser.Math.Between(0,GROUND_Y), Phaser.Math.Between(30,70), Phaser.Math.Between(40,120)); } g.fillStyle(0x1a1a2a); g.fillRect(0,GROUND_Y,1200,120); tex('mapCity',1200,720);
        g.clear(); g.fillStyle(0xeedd99); g.fillRect(0,0,1200,720); g.fillStyle(0x4488cc); for(let i=0;i<12;i++){ g.fillEllipse(Phaser.Math.Between(0,1200), Phaser.Math.Between(0,GROUND_Y), Phaser.Math.Between(50,120), Phaser.Math.Between(15,40)); } g.fillStyle(0xdcc880); g.fillRect(0,GROUND_Y,1200,120); tex('mapBeach',1200,720);
        g.clear(); g.fillStyle(0xccddee); g.fillRect(0,0,1200,720); g.fillStyle(0xffffff); for(let i=0;i<50;i++){ g.fillCircle(Phaser.Math.Between(0,1200), Phaser.Math.Between(0,720), Phaser.Math.Between(5,15)); } g.fillStyle(0xbbccdd); g.fillRect(0,GROUND_Y,1200,120); tex('mapSnow',1200,720);

        // ---- UI ----
        g.clear(); g.fillStyle(0x000000, 0.55); g.fillRoundedRect(0,0,350,120,0); tex('hudP1',350,120);
        g.clear(); g.fillStyle(0x000000, 0.55); g.fillRoundedRect(0,0,500,120,0); tex('hudMid',500,120);
        g.clear(); g.fillStyle(0x000000, 0.55); g.fillRoundedRect(0,0,350,120,0); tex('hudP2',350,120);

        // ---- WEAPON ICONS ----
        g.clear(); g.fillStyle(0xaa6633); g.fillRect(7,2,6,22); g.fillStyle(0xcc8844); g.fillRect(2,20,16,6); tex('iconStick',20,30);
        g.clear(); g.fillStyle(0x888888); g.fillCircle(10,15,9); g.fillStyle(0xaaaaaa); g.fillCircle(7,12,4); tex('iconRock',20,30);
        g.clear(); g.fillStyle(0x44aaff); g.fillRect(7,2,6,22); g.fillStyle(0x66ccff); g.fillCircle(10,24,6); tex('iconGun',20,30);
        g.clear(); g.fillStyle(0xcccccc); g.fillRect(8,0,4,26); g.fillStyle(0xffdd44); g.fillRect(2,26,16,4); tex('iconKatana',20,30);
        g.clear(); g.fillStyle(0x44ff44); g.fillCircle(10,15,10); g.fillStyle(0xffffff); g.fillRect(6,14,8,2); g.fillRect(9,11,2,8); tex('iconPotion',20,30);

        // ---- AMMO ----
        g.clear(); g.fillStyle(0xffdd44); g.fillCircle(3,3,3); tex('bullet',6,6);

        // ---- SLASH ----
        g.clear(); g.fillStyle(0xffffff, 0.9); g.beginPath(); g.moveTo(0,15); g.lineTo(40,0); g.lineTo(40,8); g.lineTo(10,18); g.closePath(); g.fillPath(); tex('slash',42,20);

        g.destroy();
      }
    }

    // ---------- MENU ----------
    class MenuScene extends Phaser.Scene {
      constructor() { super('Menu'); }
      create() {
        // Background
        this.add.rectangle(GAME_WIDTH/2, GAME_HEIGHT/2, GAME_WIDTH, GAME_HEIGHT, 0x0a1a0a);
        this.add.rectangle(GAME_WIDTH/2, 0, GAME_WIDTH, 200, 0x1a3a1a).setOrigin(0.5, 0);

        this.add.text(GAME_WIDTH/2, 70, 'ENVIRONMENT BATTLE', {
          fontFamily: 'Trebuchet MS', fontSize: '52px', fontStyle: 'bold', color: '#ffffff',
          stroke: '#2a6a2a', strokeThickness: 8, shadow: { offsetX: 3, offsetY: 3, color: '#000', blur: 8, fill: true }
        }).setOrigin(0.5);
        this.add.text(GAME_WIDTH/2, 130, 'Collect trash · Buy weapons · Destroy your rival', {
          fontFamily: 'Trebuchet MS', fontSize: '18px', color: '#88cc88'
        }).setOrigin(0.5);

        const btnStyle = (color) => ({
          fontFamily: 'Trebuchet MS', fontSize: '24px', fontStyle: 'bold', color: '#fff',
          backgroundColor: color, padding: { x: 40, y: 14 }
        });

        const twoP = this.add.text(GAME_WIDTH/2 - 160, 260, '2 PLAYERS', btnStyle('#2a6a2a')).setOrigin(0.5).setInteractive({ useHandCursor: true });
        twoP.on('pointerover', () => twoP.setStyle({ backgroundColor: '#3a8a3a' }));
        twoP.on('pointerout', () => twoP.setStyle({ backgroundColor: '#2a6a2a' }));
        twoP.on('pointerdown', () => this.startGame('2p'));

        const vsAI = this.add.text(GAME_WIDTH/2 + 160, 260, 'VS AI', btnStyle('#1a5a7a')).setOrigin(0.5).setInteractive({ useHandCursor: true });
        vsAI.on('pointerover', () => vsAI.setStyle({ backgroundColor: '#2a7a9a' }));
        vsAI.on('pointerout', () => vsAI.setStyle({ backgroundColor: '#1a5a7a' }));
        vsAI.on('pointerdown', () => this.showAISelect());

        // Map select
        this.add.text(GAME_WIDTH/2, 360, 'MAP', { fontFamily: 'Trebuchet MS', fontSize: '16px', color: '#88aa88' }).setOrigin(0.5);
        this.mapNames = ['Park', 'City', 'Beach', 'Snow'];
        this.mapColors = [0x3a5f3a, 0x2a2a3a, 0xeedd99, 0xccddee];
        this.selectedMap = 0;
        this.mapButtons = [];
        for (let i = 0; i < 4; i++) {
          const x = GAME_WIDTH/2 - 240 + i * 160;
          const bg = this.add.rectangle(x, 420, 140, 70, this.mapColors[i]).setStrokeStyle(3, i === 0 ? 0xffdd44 : 0x444444).setInteractive({ useHandCursor: true });
          const label = this.add.text(x, 420, this.mapNames[i], {
            fontFamily: 'Trebuchet MS', fontSize: '18px', fontStyle: 'bold',
            color: i === 2 ? '#333' : '#fff'
          }).setOrigin(0.5);
          bg.on('pointerdown', () => {
            this.selectedMap = i;
            this.mapButtons.forEach((b, j) => b.bg.setStrokeStyle(3, j === i ? 0xffdd44 : 0x444444));
          });
          this.mapButtons.push({ bg, label });
        }

        // Skin select
        this.add.text(GAME_WIDTH/2, 500, 'YOUR SKIN', { fontFamily: 'Trebuchet MS', fontSize: '16px', color: '#88aa88' }).setOrigin(0.5);
        this.skinKeys = ['player1', 'playerMJ', 'playerVerity', 'playerFalsity', 'playerMonkey'];
        this.skinNames = ['Green', 'MJ', 'Verity', 'Falsity', 'Monkey'];
        this.p1Skin = 0;
        this.skinButtons = [];
        for (let i = 0; i < 5; i++) {
          const x = GAME_WIDTH/2 - 240 + i * 120;
          const bg = this.add.rectangle(x, 560, 100, 60, 0x1a2a1a).setStrokeStyle(3, i === 0 ? 0xffdd44 : 0x444444).setInteractive({ useHandCursor: true });
          this.add.sprite(x - 20, 560, this.skinKeys[i]).setDisplaySize(30, 38);
          const label = this.add.text(x + 18, 560, this.skinNames[i], {
            fontFamily: 'Trebuchet MS', fontSize: '13px', color: '#fff'
          }).setOrigin(0.5);
          bg.on('pointerdown', () => {
            this.p1Skin = i;
            this.skinButtons.forEach((b, j) => b.bg.setStrokeStyle(3, j === i ? 0xffdd44 : 0x444444));
          });
          this.skinButtons.push({ bg, label });
        }

        // AI panel
        this.aiPanel = this.add.container(0, 0).setVisible(false).setDepth(100);
        const aiBg = this.add.rectangle(GAME_WIDTH/2, GAME_HEIGHT/2, 560, 460, 0x0a1a0a, 0.96).setStrokeStyle(3, 0x44aa44);
        const aiTitle = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 - 180, 'CHOOSE AI OPPONENT', {
          fontFamily: 'Trebuchet MS', fontSize: '28px', fontStyle: 'bold', color: '#fff'
        }).setOrigin(0.5);
        this.aiPanel.add([aiBg, aiTitle]);

        const aiOptions = ['Michael Jackson', 'Verity', 'Falsity', 'Monkey'];
        this.aiSkinKeys = ['playerMJ', 'playerVerity', 'playerFalsity', 'playerMonkey'];
        this.selectedAI = 0;
        this.aiButtons = [];
        for (let i = 0; i < 4; i++) {
          const y = GAME_HEIGHT/2 - 110 + i * 70;
          const bg = this.add.rectangle(GAME_WIDTH/2, y, 400, 56, 0x1a2a1a).setStrokeStyle(2, i === 0 ? 0xffdd44 : 0x444444).setInteractive({ useHandCursor: true });
          this.add.sprite(GAME_WIDTH/2 - 150, y, this.aiSkinKeys[i]).setDisplaySize(36, 46);
          const label = this.add.text(GAME_WIDTH/2 + 10, y, aiOptions[i], {
            fontFamily: 'Trebuchet MS', fontSize: '22px', fontStyle: 'bold', color: '#fff'
          }).setOrigin(0.5);
          bg.on('pointerdown', () => {
            this.selectedAI = i;
            this.aiButtons.forEach((b, j) => b.bg.setStrokeStyle(2, j === i ? 0xffdd44 : 0x444444));
          });
          this.aiButtons.push({ bg, label });
          this.aiPanel.add([bg, label]);
        }

        const startAIBtn = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 + 170, 'START BATTLE', {
          fontFamily: 'Trebuchet MS', fontSize: '22px', fontStyle: 'bold', color: '#fff',
          backgroundColor: '#2a6a2a', padding: { x: 30, y: 10 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });
        startAIBtn.on('pointerdown', () => {
          this.aiPanel.setVisible(false);
          this.startGame('ai', this.selectedAI);
        });
        this.aiPanel.add(startAIBtn);

        const backBtn = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 + 220, 'CANCEL', {
          fontFamily: 'Trebuchet MS', fontSize: '16px', color: '#ff8888'
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });
        backBtn.on('pointerdown', () => this.aiPanel.setVisible(false));
        this.aiPanel.add(backBtn);
      }

      showAISelect() { this.aiPanel.setVisible(true); }

      startGame(mode, aiIndex = 0) {
        this.scene.start('Game', {
          mode, map: this.selectedMap,
          p1Skin: this.skinKeys[this.p1Skin],
          p2Skin: mode === '2p' ? this.skinKeys[(this.p1Skin + 1) % 5] : this.aiSkinKeys[aiIndex],
          aiIndex
        });
      }
    }

    // ---------- GAME ----------
    class GameScene extends Phaser.Scene {
      constructor() { super('Game'); }

      init(data) {
        this.mode = data.mode;
        this.mapIndex = data.map || 0;
        this.p1Skin = data.p1Skin || 'player1';
        this.p2Skin = data.p2Skin || 'playerVerity';
        this.aiIndex = data.aiIndex || 0;
        this.mapKeys = ['mapPark', 'mapCity', 'mapBeach', 'mapSnow'];

        this.trashItems = [
          { key: 'trashCan', points: 10, scrap: 3 },
          { key: 'trashBottle', points: 15, scrap: 4 },
          { key: 'trashBag', points: 20, scrap: 5 },
          { key: 'trashPaper', points: 5, scrap: 2 },
          { key: 'trashBox', points: 25, scrap: 6 }
        ];
        this.nonTrashItems = [
          { key: 'apple', points: -10, name: 'Apple' },
          { key: 'orange', points: -15, name: 'Orange' },
          { key: 'cup', points: -8, name: 'Cup' }
        ];
        this.anvilItem = { key: 'anvil', points: -30, name: 'Anvil' };

        // Shop catalog
        this.shopItems = [
          { id: 'gun', name: 'Auto Gun', icon: 'iconGun', cost: 30, desc: 'Shoots bullets' },
          { id: 'katana', name: 'Katana', icon: 'iconKatana', cost: 45, desc: 'Melee slash' },
          { id: 'potion', name: 'Health Potion', icon: 'iconPotion', cost: 20, desc: '+40 HP' },
          { id: 'armor', name: 'Armor', icon: 'iconStick', cost: 35, desc: 'Reduce dmg' }
        ];

        this.p1 = this.createPlayer(175, 'p1');
        this.p2 = this.createPlayer(1025, 'p2');

        this.fallingItems = [];
        this.bullets = [];
        this.gameOver = false;
      }

      createPlayer(x, side) {
        return {
          x, y: GROUND_Y, vx: 0,
          side, score: 0, health: 100, maxHealth: 100,
          stunned: false, stunTimer: 0,
          facing: side === 'p1' ? 1 : -1,
          animTimer: 0, scrap: 0,
          weapon: null, // 'gun' | 'katana'
          armor: 0,
          attackCooldown: 0,
          fireCooldown: 0,
          inBattle: false
        };
      }

      create() {
        // Map
        this.add.image(GAME_WIDTH/2, GAME_HEIGHT/2, this.mapKeys[this.mapIndex]).setDisplaySize(GAME_WIDTH, GAME_HEIGHT);

        // Zone dividers
        this.add.rectangle(ZONE.mid.x, GAME_HEIGHT/2, 3, GAME_HEIGHT, 0xffdd44, 0.5);
        this.add.rectangle(ZONE.mid.x + ZONE.mid.w, GAME_HEIGHT/2, 3, GAME_HEIGHT, 0xffdd44, 0.5);

        // Zone labels
        this.add.text(ZONE.p1.cx, 140, 'P1 COLLECT', { fontFamily: 'Trebuchet MS', fontSize: '14px', fontStyle: 'bold', color: '#88ff88' }).setOrigin(0.5);
        this.add.text(ZONE.mid.cx, 140, '⚔ BATTLEGROUND ⚔', { fontFamily: 'Trebuchet MS', fontSize: '18px', fontStyle: 'bold', color: '#ffdd44' }).setOrigin(0.5);
        this.add.text(ZONE.p2.cx, 140, this.mode === 'ai' ? 'AI COLLECT' : 'P2 COLLECT', { fontFamily: 'Trebuchet MS', fontSize: '14px', fontStyle: 'bold', color: '#88bbff' }).setOrigin(0.5);

        // HUDs
        this.add.image(ZONE.p1.cx, 0, 'hudP1').setOrigin(0.5, 0);
        this.add.image(ZONE.mid.cx, 0, 'hudMid').setOrigin(0.5, 0);
        this.add.image(ZONE.p2.cx, 0, 'hudP2').setOrigin(0.5, 0);

        this.buildHUD('p1', ZONE.p1.cx);
        this.buildHUD('p2', ZONE.p2.cx);
        this.buildMidHUD();

        // Player sprites
        this.p1Sprite = this.add.sprite(this.p1.x, this.p1.y, this.p1Skin).setDepth(10);
        this.p2Sprite = this.add.sprite(this.p2.x, this.p2.y, this.p2Skin).setDepth(10);
        this.p1Bin = this.add.sprite(this.p1.x, this.p1.y - 30, 'bin').setDepth(11);
        this.p2Bin = this.add.sprite(this.p2.x, this.p2.y - 30, 'bin').setDepth(11);

        // Stun texts
        this.p1StunText = this.add.text(this.p1.x, this.p1.y - 90, 'STUNNED', {
          fontFamily: 'Trebuchet MS', fontSize: '20px', fontStyle: 'bold', color: '#ff4444',
          stroke: '#000', strokeThickness: 3
        }).setOrigin(0.5).setVisible(false).setDepth(20);
        this.p2StunText = this.add.text(this.p2.x, this.p2.y - 90, 'STUNNED', {
          fontFamily: 'Trebuchet MS', fontSize: '20px', fontStyle: 'bold', color: '#ff4444',
          stroke: '#000', strokeThickness: 3
        }).setOrigin(0.5).setVisible(false).setDepth(20);

        // Input
        this.input.addPointer(4);
        this.cursors = this.input.keyboard.createCursorKeys();
        this.keys = this.input.keyboard.addKeys({
          a: Phaser.Input.Keyboard.KeyCodes.A, d: Phaser.Input.Keyboard.KeyCodes.D,
          w: Phaser.Input.Keyboard.KeyCodes.W, s: Phaser.Input.Keyboard.KeyCodes.S,
          left: Phaser.Input.Keyboard.KeyCodes.LEFT, right: Phaser.Input.Keyboard.KeyCodes.RIGHT,
          up: Phaser.Input.Keyboard.KeyCodes.UP, down: Phaser.Input.Keyboard.KeyCodes.DOWN
        });

        this.touchState = {
          p1Left: false, p1Right: false, p1Up: false, p1Down: false, p1Action: false,
          p2Left: false, p2Right: false, p2Up: false, p2Down: false, p2Action: false
        };

        this.buildTouchControls();

        // Spawn timer — items fall in collection zones
        this.time.addEvent({ delay: 700, callback: this.spawnItem, callbackScope: this, loop: true });

        // Shop button
        this.buildShopButton();
      }

      buildHUD(side, cx) {
        const p = side === 'p1' ? this.p1 : this.p2;
        const name = side === 'p1' ? 'PLAYER 1' : (this.mode === 'ai' ? this.getAIName() : 'PLAYER 2');
        const color = side === 'p1' ? '#88ff88' : '#88bbff';

        this[side + 'NameText'] = this.add.text(cx, 14, name, {
          fontFamily: 'Trebuchet MS', fontSize: '15px', fontStyle: 'bold', color
        }).setOrigin(0.5);

        this[side + 'ScoreText'] = this.add.text(cx, 36, '0 pts', {
          fontFamily: 'Trebuchet MS', fontSize: '18px', fontStyle: 'bold', color: '#fff'
        }).setOrigin(0.5);

        // Health bar
        this.add.rectangle(cx, 62, 200, 14, 0x333333).setStrokeStyle(1, 0x000000);
        this[side + 'HealthFill'] = this.add.rectangle(cx - 100, 62, 200, 14, 0x44ff44).setOrigin(0, 0.5);
        this[side + 'HealthText'] = this.add.text(cx, 62, '100', {
          fontFamily: 'Trebuchet MS', fontSize: '11px', fontStyle: 'bold', color: '#fff'
        }).setOrigin(0.5);

        // Scrap
        this[side + 'ScrapText'] = this.add.text(cx, 84, 'Scrap: 0', {
          fontFamily: 'Trebuchet MS', fontSize: '13px', color: '#ffdd44'
        }).setOrigin(0.5);

        // Weapon
        this[side + 'WeaponText'] = this.add.text(cx, 104, 'No weapon', {
          fontFamily: 'Trebuchet MS', fontSize: '12px', color: '#aaa'
        }).setOrigin(0.5);
      }

      buildMidHUD() {
        this.add.text(ZONE.mid.cx, 14, 'FIGHT!', {
          fontFamily: 'Trebuchet MS', fontSize: '22px', fontStyle: 'bold', color: '#ffdd44'
        }).setOrigin(0.5);
        this.midStatusText = this.add.text(ZONE.mid.cx, 44, 'Collect scrap in your zone, then buy weapons', {
          fontFamily: 'Trebuchet MS', fontSize: '13px', color: '#ccc'
        }).setOrigin(0.5);
      }

      buildShopButton() {
        // Shop button in the middle HUD
        const shopBtn = this.add.rectangle(ZONE.mid.cx, 90, 160, 36, 0x2a5a2a).setStrokeStyle(2, 0x88ff88).setInteractive({ useHandCursor: true });
        this.add.text(ZONE.mid.cx, 90, '🛒 SHOP (P1)', {
          fontFamily: 'Trebuchet MS', fontSize: '14px', fontStyle: 'bold', color: '#fff'
        }).setOrigin(0.5);
        shopBtn.on('pointerdown', () => this.openShop('p1'));

        // P2 shop button (for 2P mode)
        if (this.mode === '2p') {
          const shopBtn2 = this.add.rectangle(ZONE.mid.cx, 130, 160, 36, 0x2a3a5a).setStrokeStyle(2, 0x88bbff).setInteractive({ useHandCursor: true });
          this.add.text(ZONE.mid.cx, 130, '🛒 SHOP (P2)', {
            fontFamily: 'Trebuchet MS', fontSize: '14px', fontStyle: 'bold', color: '#fff'
          }).setOrigin(0.5);
          shopBtn2.on('pointerdown', () => this.openShop('p2'));
        } else {
          // AI shops automatically
          this.time.addEvent({ delay: 4000, callback: () => this.aiShop(), callbackScope: this, loop: true });
        }
      }

      openShop(side) {
        const p = side === 'p1' ? this.p1 : this.p2;
        const cx = side === 'p1' ? ZONE.p1.cx : ZONE.p2.cx;

        // Shop overlay
        const overlay = this.add.container(0, 0).setDepth(200);
        const bg = this.add.rectangle(ZONE.mid.cx, GAME_HEIGHT/2, 460, 500, 0x0a1a0a, 0.96).setStrokeStyle(3, 0xffdd44);
        const title = this.add.text(ZONE.mid.cx, GAME_HEIGHT/2 - 220, `SHOP — ${side === 'p1' ? 'P1' : 'P2'}`, {
          fontFamily: 'Trebuchet MS', fontSize: '24px', fontStyle: 'bold', color: '#ffdd44'
        }).setOrigin(0.5);
        const scrapText = this.add.text(ZONE.mid.cx, GAME_HEIGHT/2 - 180, `Your Scrap: ${p.scrap}`, {
          fontFamily: 'Trebuchet MS', fontSize: '16px', color: '#fff'
        }).setOrigin(0.5);
        overlay.add([bg, title, scrapText]);

        // Close button
        const closeBtn = this.add.text(ZONE.mid.cx + 210, GAME_HEIGHT/2 - 230, '✕', {
          fontFamily: 'Trebuchet MS', fontSize: '24px', color: '#ff8888'
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });
        closeBtn.on('pointerdown', () => overlay.destroy());
        overlay.add(closeBtn);

        // Shop items
        this.shopItems.forEach((item, i) => {
          const y = GAME_HEIGHT/2 - 120 + i * 80;
          const canAfford = p.scrap >= item.cost;
          const bgColor = canAfford ? 0x1a3a1a : 0x2a1a1a;

          const itemBg = this.add.rectangle(ZONE.mid.cx, y, 380, 68, bgColor).setStrokeStyle(2, canAfford ? 0x44aa44 : 0x664444);
          const icon = this.add.sprite(ZONE.mid.cx - 150, y, item.icon).setDisplaySize(28, 40);
          const nameText = this.add.text(ZONE.mid.cx - 110, y - 12, item.name, {
            fontFamily: 'Trebuchet MS', fontSize: '16px', fontStyle: 'bold', color: '#fff'
          });
          const descText = this.add.text(ZONE.mid.cx - 110, y + 8, item.desc, {
            fontFamily: 'Trebuchet MS', fontSize: '12px', color: '#aaa'
          });
          const costText = this.add.text(ZONE.mid.cx + 150, y, `${item.cost} scrap`, {
            fontFamily: 'Trebuchet MS', fontSize: '14px', fontStyle: 'bold', color: canAfford ? '#ffdd44' : '#ff6666'
          }).setOrigin(0.5);

          overlay.add([itemBg, icon, nameText, descText, costText]);

          if (canAfford) {
            itemBg.setInteractive({ useHandCursor: true });
            itemBg.on('pointerover', () => itemBg.setFillStyle(0x2a5a2a));
            itemBg.on('pointerout', () => itemBg.setFillStyle(bgColor));
            itemBg.on('pointerdown', () => {
              this.buyItem(side, item);
              overlay.destroy();
            });
          }
        });
      }

      buyItem(side, item) {
        const p = side === 'p1' ? this.p1 : this.p2;
        if (p.scrap < item.cost) return;
        p.scrap -= item.cost;

        if (item.id === 'potion') {
          p.health = Math.min(p.maxHealth, p.health + 40);
          this.showFloatingText(p.x, p.y - 80, '+40 HP', '#44ff44');
        } else if (item.id === 'armor') {
          p.armor = Math.min(3, p.armor + 1);
          this.showFloatingText(p.x, p.y - 80, `Armor Lv${p.armor}`, '#88bbff');
        } else {
          p.weapon = item.id;
          this.showFloatingText(p.x, p.y - 80, `${item.name}!`, '#ffdd44');
        }
        this.updateHUD();
      }

      aiShop() {
        if (this.gameOver) return;
        const p = this.p2;
        // AI prioritizes potion if low HP, else weapon
        if (p.health < 40 && p.scrap >= 20) {
          p.scrap -= 20; p.health = Math.min(p.maxHealth, p.health + 40);
        } else if (!p.weapon && p.scrap >= 30) {
          p.scrap -= 30; p.weapon = 'gun';
        } else if (!p.weapon && p.scrap >= 45) {
          p.scrap -= 45; p.weapon = 'katana';
        } else if (p.weapon === 'gun' && p.scrap >= 35) {
          p.scrap -= 35; p.armor = Math.min(3, p.armor + 1);
        }
        this.updateHUD();
      }

      buildTouchControls() {
        const btnSize = 56;
        const alpha = 0.35;

        // P1 D-pad
        const p1BaseX = 70, p1BaseY = GAME_HEIGHT - 160;
        this.makeBtn(p1BaseX - 30, p1BaseY + 30, btnSize, alpha, '◀', () => this.touchState.p1Left = true, () => this.touchState.p1Left = false);
        this.makeBtn(p1BaseX + 40, p1BaseY + 30, btnSize, alpha, '▶', () => this.touchState.p1Right = true, () => this.touchState.p1Right = false);
        this.makeBtn(p1BaseX + 5, p1BaseY - 30, btnSize, alpha, '▲', () => this.touchState.p1Up = true, () => this.touchState.p1Up = false);
        this.makeBtn(p1BaseX + 5, p1BaseY + 90, btnSize, alpha, '▼', () => this.touchState.p1Down = true, () => this.touchState.p1Down = false);

        // P1 action
        this.makeBtn(p1BaseX + 5, p1BaseY - 100, btnSize + 10, 0.55, '⚔', () => this.touchState.p1Action = true, () => this.touchState.p1Action = false, 0xcc3333);

        // P2 D-pad
        const p2BaseX = GAME_WIDTH - 70, p2BaseY = GAME_HEIGHT - 160;
        this.makeBtn(p2BaseX - 40, p2BaseY + 30, btnSize, alpha, '◀', () => this.touchState.p2Left = true, () => this.touchState.p2Left = false);
        this.makeBtn(p2BaseX + 30, p2BaseY + 30, btnSize, alpha, '▶', () => this.touchState.p2Right = true, () => this.touchState.p2Right = false);
        this.makeBtn(p2BaseX - 5, p2BaseY - 30, btnSize, alpha, '▲', () => this.touchState.p2Up = true, () => this.touchState.p2Up = false);
        this.makeBtn(p2BaseX - 5, p2BaseY + 90, btnSize, alpha, '▼', () => this.touchState.p2Down = true, () => this.touchState.p2Down = false);
        this.makeBtn(p2BaseX - 5, p2BaseY - 100, btnSize + 10, 0.55, '⚔', () => this.touchState.p2Action = true, () => this.touchState.p2Action = false, 0x3355cc);
      }

      makeBtn(x, y, size, alpha, label, onDown, onUp, color = 0xffffff) {
        const btn = this.add.rectangle(x, y, size, size, color, alpha).setInteractive().setDepth(30);
        this.add.text(x, y, label, { fontFamily: 'Trebuchet MS', fontSize: '22px', color: '#fff' }).setOrigin(0.5).setDepth(31);
        btn.on('pointerdown', onDown);
        btn.on('pointerup', onUp);
        btn.on('pointerout', onUp);
        return btn;
      }

      getAIName() {
        return ['Michael Jackson', 'Verity', 'Falsity', 'Monkey'][this.aiIndex];
      }

      spawnItem() {
        if (this.gameOver) return;
        const roll = Phaser.Math.Between(1, 100);
        let isAnvil = false, isTrash = false, def;

        if (roll <= 8) { isAnvil = true; def = this.anvilItem; }
        else if (roll <= 70) { isTrash = true; def = Phaser.Utils.Array.GetRandom(this.trashItems); }
        else { def = Phaser.Utils.Array.GetRandom(this.nonTrashItems); }

        // Spawn in either P1 or P2 zone
        const inP1 = Math.random() < 0.5;
        const zone = inP1 ? ZONE.p1 : ZONE.p2;
        const x = Phaser.Math.Between(zone.x + 30, zone.x + zone.w - 30);

        const sprite = this.add.sprite(x, -40, def.key).setDepth(5);

        // Glow
        if (isTrash) {
          sprite.setTint(0xff9999);
          this.tweens.add({ targets: sprite, scaleX: { from: 1, to: 1.15 }, scaleY: { from: 1, to: 1.15 }, duration: 500, yoyo: true, repeat: -1 });
        } else if (!isAnvil) {
          sprite.setTint(0x99ff99);
          this.tweens.add({ targets: sprite, scaleX: { from: 1, to: 1.1 }, scaleY: { from: 1, to: 1.1 }, duration: 500, yoyo: true, repeat: -1 });
        } else {
          sprite.setTint(0xff6666);
        }

        this.fallingItems.push({
          sprite, def, isTrash, isAnvil, zone: inP1 ? 'p1' : 'p2',
          speed: isAnvil ? 200 : Phaser.Math.Between(140, 240),
          vx: isAnvil ? 0 : Phaser.Math.Between(-15, 15)
        });
      }

      updateHUD() {
        this.p1ScoreText.setText(this.p1.score + ' pts');
        this.p2ScoreText.setText(this.p2.score + ' pts');
        this.p1HealthText.setText(Math.max(0, Math.round(this.p1.health)));
        this.p2HealthText.setText(Math.max(0, Math.round(this.p2.health)));
        this.p1ScrapText.setText('Scrap: ' + this.p1.scrap);
        this.p2ScrapText.setText('Scrap: ' + this.p2.scrap);
        this.p1WeaponText.setText(this.p1.weapon ? '🔫 ' + (this.p1.weapon === 'gun' ? 'Auto Gun' : 'Katana') : 'No weapon');
        this.p2WeaponText.setText(this.p2.weapon ? '🔫 ' + (this.p2.weapon === 'gun' ? 'Auto Gun' : 'Katana') : 'No weapon');

        const p1Pct = Math.max(0, this.p1.health / this.p1.maxHealth);
        const p2Pct = Math.max(0, this.p2.health / this.p2.maxHealth);
        this.p1HealthFill.setDisplaySize(200 * p1Pct, 14);
        this.p2HealthFill.setDisplaySize(200 * p2Pct, 14);
        this.p1HealthFill.setFillStyle(p1Pct > 0.5 ? 0x44ff44 : p1Pct > 0.25 ? 0xffaa44 : 0xff4444);
        this.p2HealthFill.setFillStyle(p2Pct > 0.5 ? 0x44ff44 : p2Pct > 0.25 ? 0xffaa44 : 0xff4444);
      }

      showFloatingText(x, y, text, color) {
        const t = this.add.text(x, y, text, {
          fontFamily: 'Trebuchet MS', fontSize: '20px', fontStyle: 'bold', color,
          stroke: '#000', strokeThickness: 4
        }).setOrigin(0.5).setDepth(60);
        this.tweens.add({ targets: t, y: y - 70, alpha: 0, duration: 1000, onComplete: () => t.destroy() });
      }

      update(time, delta) {
        if (this.gameOver) return;
        const dt = delta / 1000;

        // ---- Movement ----
        this.handleMovement('p1', dt);
        if (this.mode === '2p') this.handleMovement('p2', dt);
        else this.handleAI(dt);

        // ---- Battle detection ----
        this.p1.inBattle = this.p1.x > ZONE.mid.x;
        this.p2.inBattle = this.p2.x < ZONE.mid.x + ZONE.mid.w;

        // ---- Attack/fire ----
        if (!this.p1.stunned) {
          this.p1.attackCooldown -= delta;
          this.p1.fireCooldown -= delta;

          const p1Action = this.keys.w.isDown || this.touchState.p1Action;
          if (p1Action && this.p1.inBattle && this.p1.weapon) {
            if (this.p1.weapon === 'katana' && this.p1.attackCooldown <= 0) {
              this.meleeAttack('p1'); this.p1.attackCooldown = 600;
            } else if (this.p1.weapon === 'gun' && this.p1.fireCooldown <= 0) {
              this.fireBullet('p1'); this.p1.fireCooldown = 400;
            }
          }
        }

        if (!this.p2.stunned) {
          this.p2.attackCooldown -= delta;
          this.p2.fireCooldown -= delta;

          const p2Action = this.mode === '2p'
            ? (this.keys.up.isDown || this.touchState.p2Action)
            : this.p2.inBattle && this.p2.weapon && Math.abs(this.p2.x - this.p1.x) < 250;

          if (p2Action && this.p2.inBattle && this.p2.weapon) {
            if (this.p2.weapon === 'katana' && this.p2.attackCooldown <= 0) {
              this.meleeAttack('p2'); this.p2.attackCooldown = 600;
            } else if (this.p2.weapon === 'gun' && this.p2.fireCooldown <= 0) {
              this.fireBullet('p2'); this.p2.fireCooldown = 500;
            }
          }
        }

        // ---- Update sprites ----
        this.updateSprites(delta);

        // ---- Falling items ----
        this.updateItems(dt);

        // ---- Bullets ----
        this.updateBullets(dt);

        // ---- Stun timers ----
        this.updateStun('p1', delta);
        this.updateStun('p2', delta);

        this.updateHUD();
      }

      handleMovement(side, dt) {
        const p = side === 'p1' ? this.p1 : this.p2;
        if (p.stunned) { p.vx = 0; return; }

        let mx = 0;
        if (side === 'p1') {
          if (this.keys.a.isDown || this.touchState.p1Left) mx -= 1;
          if (this.keys.d.isDown || this.touchState.p1Right) mx += 1;
        } else {
          if (this.keys.left.isDown || this.touchState.p2Left) mx -= 1;
          if (this.keys.right.isDown || this.touchState.p2Right) mx += 1;
        }
        p.vx = mx * 260;
        if (mx !== 0) p.facing = mx;
        p.x = Phaser.Math.Clamp(p.x + p.vx * dt, 20, GAME_WIDTH - 20);
      }

      handleAI(dt) {
        const p = this.p2;
        if (p.stunned) { p.vx = 0; return; }

        // If has weapon and enough health, go to battleground to fight
        if (p.weapon && p.health > 30) {
          // Move towards battleground center
          const targetX = ZONE.mid.cx;
          const dx = targetX - p.x;
          if (Math.abs(dx) > 10) {
            p.vx = Math.sign(dx) * 220;
            p.facing = Math.sign(dx);
          } else {
            p.vx = 0;
            // Move towards player if in battleground
            if (this.p1.inBattle) {
              const dxP = this.p1.x - p.x;
              if (Math.abs(dxP) > 80) {
                p.vx = Math.sign(dxP) * 200;
                p.facing = Math.sign(dxP);
              }
            }
          }
        } else {
          // Collect in own zone
          let targetX = p.x;
          let bestDist = Infinity;
          for (const item of this.fallingItems) {
            if (item.zone === 'p2' && item.isTrash) {
              const d = Math.abs(item.sprite.x - p.x) + Math.abs(item.sprite.y - p.y) * 0.3;
              if (d < bestDist) { bestDist = d; targetX = item.sprite.x; }
            }
          }
          if (bestDist === Infinity) targetX = ZONE.p2.cx;
          const dx = targetX - p.x;
          if (Math.abs(dx) > 6) {
            p.vx = Math.sign(dx) * 240;
            p.facing = Math.sign(dx);
          } else {
            p.vx = 0;
          }
        }

        p.x = Phaser.Math.Clamp(p.x + p.vx * dt, ZONE.p2.x + 20, GAME_WIDTH - 20);
      }

      updateSprites(delta) {
        this.p1.animTimer += delta;
        this.p2.animTimer += delta;
        const bob1 = Math.sin(this.p1.animTimer * 0.008) * 2;
        const bob2 = Math.sin(this.p2.animTimer * 0.008) * 2;

        this.p1Sprite.setPosition(this.p1.x, this.p1.y + bob1).setFlipX(this.p1.facing < 0);
        this.p1Bin.setPosition(this.p1.x, this.p1.y - 30 + bob1);
        this.p2Sprite.setPosition(this.p2.x, this.p2.y + bob2).setFlipX(this.p2.facing < 0);
        this.p2Bin.setPosition(this.p2.x, this.p2.y - 30 + bob2);

        this.p1StunText.setPosition(this.p1.x, this.p1.y - 90);
        this.p2StunText.setPosition(this.p2.x, this.p2.y - 90);
      }

      updateItems(dt) {
        for (let i = this.fallingItems.length - 1; i >= 0; i--) {
          const item = this.fallingItems[i];
          item.sprite.y += item.speed * dt;
          item.sprite.x += item.vx * dt;
          item.sprite.rotation += 0.02;

          // Collision with players (only in their own zones OR battleground)
          const p1Active = item.zone === 'p1' && this.p1.x < ZONE.mid.x + 50;
          const p2Active = item.zone === 'p2' && this.p2.x > ZONE.mid.x + ZONE.mid.w - 50;

          let caught = false;
          if (p1Active) {
            const d = Phaser.Math.Distance.Between(item.sprite.x, item.sprite.y, this.p1.x, this.p1.y - 20);
            if (d < 42) { this.handleCatch(item, 'p1'); caught = true; }
          }
          if (!caught && p2Active) {
            const d = Phaser.Math.Distance.Between(item.sprite.x, item.sprite.y, this.p2.x, this.p2.y - 20);
            if (d < 42) { this.handleCatch(item, 'p2'); caught = true; }
          }

          if (caught || item.sprite.y > GAME_HEIGHT + 50) {
            item.sprite.destroy();
            this.fallingItems.splice(i, 1);
          }
        }
      }

      updateBullets(dt) {
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const b = this.bullets[i];
          b.sprite.x += b.vx * dt;
          b.sprite.y += b.vy * dt;

          const target = b.owner === 'p1' ? this.p2 : this.p1;
          const d = Phaser.Math.Distance.Between(b.sprite.x, b.sprite.y, target.x, target.y - 20);

          if (d < 30) {
            const dmg = Math.max(2, 10 - target.armor * 3);
            target.health -= dmg;
            this.showFloatingText(target.x, target.y - 60, `-${dmg}`, '#ff4444');
            b.sprite.destroy();
            this.bullets.splice(i, 1);
            if (target.health <= 0) this.endGame(b.owner);
            continue;
          }

          if (b.sprite.x < 0 || b.sprite.x > GAME_WIDTH || b.sprite.y < 0 || b.sprite.y > GAME_HEIGHT) {
            b.sprite.destroy();
            this.bullets.splice(i, 1);
          }
        }
      }

      updateStun(side, delta) {
        const p = side === 'p1' ? this.p1 : this.p2;
        const text = side === 'p1' ? this.p1StunText : this.p2StunText;
        const sprite = side === 'p1' ? this.p1Sprite : this.p2Sprite;

        if (p.stunned) {
          p.stunTimer -= delta;
          if (p.stunTimer <= 0) {
            p.stunned = false;
            text.setVisible(false);
            sprite.clearTint();
          }
        }
      }

      fireBullet(side) {
        const p = side === 'p1' ? this.p1 : this.p2;
        const target = side === 'p1' ? this.p2 : this.p1;
        const angle = Phaser.Math.Angle.Between(p.x, p.y - 20, target.x, target.y - 20);

        const sprite = this.add.sprite(p.x + Math.cos(angle) * 30, p.y - 20 + Math.sin(angle) * 20, 'bullet').setDepth(15);
        this.bullets.push({
          sprite, vx: Math.cos(angle) * 500, vy: Math.sin(angle) * 500, owner: side
        });
      }

      meleeAttack(side) {
        const attacker = side === 'p1' ? this.p1 : this.p2;
        const defender = side === 'p1' ? this.p2 : this.p1;

        if (Math.abs(attacker.x - defender.x) > 130) return;

        const dmg = Math.max(3, 18 - defender.armor * 4);
        defender.health -= dmg;
        defender.stunned = true;
        defender.stunTimer = 600;

        if (side === 'p1') {
          this.p2StunText.setVisible(true);
          this.p2Sprite.setTint(0xff4444);
        } else {
          this.p1StunText.setVisible(true);
          this.p1Sprite.setTint(0xff4444);
        }

        // Slash visual
        const slash = this.add.sprite(attacker.x + 30 * attacker.facing, attacker.y - 20, 'slash').setDepth(40).setFlipX(attacker.facing < 0);
        this.tweens.add({ targets: slash, alpha: 0, scaleX: 2, duration: 250, onComplete: () => slash.destroy() });

        this.showFloatingText(defender.x, defender.y - 70, `-${dmg}`, '#ff4444');

        if (defender.health <= 0) this.endGame(side);
      }

      handleCatch(item, side) {
        const p = side === 'p1' ? this.p1 : this.p2;

        if (item.isAnvil) {
          const dmg = Phaser.Math.Between(20, 40);
          p.health -= dmg;
          p.stunned = true;
          p.stunTimer = 1500;
          const stunText = side === 'p1' ? this.p1StunText : this.p2StunText;
          const sprite = side === 'p1' ? this.p1Sprite : this.p2Sprite;
          stunText.setVisible(true);
          sprite.setTint(0xff4444);
          this.showFloatingText(p.x, p.y - 70, `ANVIL -${dmg}`, '#ff4444');
        } else if (item.isTrash) {
          p.score += item.def.points;
          p.scrap += item.def.scrap;
          this.showFloatingText(p.x, p.y - 70, `+${item.def.points}`, '#44ff44');
        } else {
          p.score += item.def.points;
          const hpDmg = Math.abs(item.def.points);
          p.health -= hpDmg;
          this.showFloatingText(p.x, p.y - 70, `-${hpDmg} HP`, '#ffaa44');
        }

        p.health = Math.max(0, Math.min(p.maxHealth, p.health));
        if (p.health <= 0) this.endGame(side === 'p1' ? 'p2' : 'p1');
      }

      endGame(winner) {
        this.gameOver = true;
        const winText = winner === 'p1' ? 'PLAYER 1 WINS!' : (this.mode === 'ai' ? 'AI WINS!' : 'PLAYER 2 WINS!');
        const color = winner === 'p1' ? '#44ff44' : '#ff4444';

        this.add.rectangle(GAME_WIDTH/2, GAME_HEIGHT/2, GAME_WIDTH, GAME_HEIGHT, 0x000000, 0.8).setDepth(300);
        this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 - 80, winText, {
          fontFamily: 'Trebuchet MS', fontSize: '56px', fontStyle: 'bold', color,
          stroke: '#000', strokeThickness: 8
        }).setOrigin(0.5).setDepth(301);

        this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 + 10, `P1: ${this.p1.score} pts  |  P2: ${this.p2.score} pts`, {
          fontFamily: 'Trebuchet MS', fontSize: '24px', color: '#fff'
        }).setOrigin(0.5).setDepth(301);

        const btn = this.add.text(GAME_WIDTH/2, GAME_HEIGHT/2 + 110, 'PLAY AGAIN', {
          fontFamily: 'Trebuchet MS', fontSize: '26px', fontStyle: 'bold', color: '#fff',
          backgroundColor: '#2a6a2a', padding: { x: 40, y: 14 }
        }).setOrigin(0.5).setInteractive({ useHandCursor: true }).setDepth(301);
        btn.on('pointerdown', () => this.scene.start('Menu'));
      }
    }

    // ---------- CONFIG ----------
    const config = {
      type: Phaser.AUTO,
      width: GAME_WIDTH,
      height: GAME_HEIGHT,
      parent: 'game-container',
      backgroundColor: '#0a0f0a',
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: GAME_WIDTH,
        height: GAME_HEIGHT
      },
      scene: [BootScene, MenuScene, GameScene],
      physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
      input: { activePointers: 4, touch: { capture: true } }
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
