<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phaser Square</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1a1a1a;
    }
  </style>
</head>
<body>

<script>
  const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    backgroundColor: '#2d2d2d',
    scene: {
      create: create
    }
  };

  const game = new Phaser.Game(config);

  function create() {
    // Draws a 100x100 green square at the center (400, 300)
    this.add.rectangle(400, 300, 100, 100, 0x00ff00);
  }
</script>

</body>
</html>
